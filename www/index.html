<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>고양이퍼즐</title><meta name="theme-color" content="#ff970f"><link rel="manifest" href="manifest.webmanifest"><style>:root{--card:#fffdf9;--panel:#fff2df;--line:#f1d2b0;--text:#3a2a22;--muted:#7d6657;--accent:#ff960f;--accent2:#ffb347;--ok:#16a34a;--bad:#ef4444}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(180deg,#fffaf4,#ffe9d1 78%);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:12px}.app{width:min(100%,700px);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px 12px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-1px}.stage{font-weight:900;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}.rule{margin-top:8px;font-size:17px;font-weight:900}.mini{margin-top:12px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:stretch}.mini-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px;text-align:center}.mini-label{font-size:12px;color:var(--muted);font-weight:800}.mini-value{margin-top:3px;font-size:21px;font-weight:900}.memory-btn{border:0;border-radius:16px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-size:16px;font-weight:900;padding:0 16px;min-height:62px;cursor:pointer}.bubble{margin-top:12px;border:2px dashed #ffc46c;border-radius:18px;background:#fff;padding:13px 15px;font-size:17px;font-weight:900;text-align:center}.board-wrap{margin-top:14px;border:1px solid var(--line);border-radius:20px;background:#fff;padding:10px}.board{display:grid;gap:7px;max-width:560px;margin:0 auto}.cell{position:relative;aspect-ratio:1/1;border:2px solid var(--line);border-radius:13px;background:#fff7ee;overflow:hidden;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}.inner{position:relative;z-index:1;font-size:27px}.door{position:absolute;inset:0;background:linear-gradient(180deg,#ffe8c9,#ffd39a);display:flex;align-items:center;justify-content:center;font-weight:900;color:#8a5c24;font-size:13px;transform-origin:left center;transition:transform .2s ease,opacity .15s ease;border-radius:10px}.cell.open .door{transform:rotateY(88deg);opacity:.12}.cell.correct{border-color:#86d399;background:#effcf2}.cell.wrong{border-color:#f6a6a6;background:#fff1f1}.cell.bomb{border-color:#fb923c;background:#fff5eb}.message{margin-top:12px;min-height:44px;text-align:center;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center}.message.ok{color:var(--ok)}.message.bad{color:var(--bad)}.bottom{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom button{min-height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:16px;cursor:pointer}.bottom button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:420px){h1{font-size:26px}.mini{grid-template-columns:1fr 1fr}.memory-btn{grid-column:1/-1}.board{gap:5px}.inner{font-size:23px}}</style></head><body><main class="app"><div class="top"><h1>고양이퍼즐</h1><div class="stage" id="stageLabel">STAGE 1</div></div><div class="rule">쥐를 모두 찾아라. 폭탄은 안돼.</div><div class="mini"><div class="mini-card"><div class="mini-label">숨은 쥐</div><div class="mini-value" id="hiddenMice">3</div></div><div class="mini-card"><div class="mini-label">찾은 쥐</div><div class="mini-value" id="foundMice">0</div></div><button class="memory-btn" id="memoryBtn" type="button">기억 시작</button></div><div class="bubble" id="bubble">이번 스테이지는 꽤 까다로울껄요?</div><div class="board-wrap"><div class="board" id="board"></div></div><div class="message" id="message" aria-live="polite"></div><div class="bottom"><button id="retryBtn" type="button">다시하기</button><button id="nextBtn" type="button" disabled>다음 스테이지</button></div></main><script>(()=>{const STAGES=[{grid:5,mice:3,bombs:1,openMs:250,showMs:360,loops:1,flashback:1},{grid:5,mice:4,bombs:2,openMs:220,showMs:320,loops:1,flashback:2},{grid:6,mice:4,bombs:2,openMs:200,showMs:290,loops:1,flashback:2},{grid:6,mice:5,bombs:3,openMs:175,showMs:260,loops:1,flashback:3},{grid:6,mice:6,bombs:3,openMs:160,showMs:230,loops:2,flashback:3}],board=document.getElementById('board'),stageLabel=document.getElementById('stageLabel'),hiddenMice=document.getElementById('hiddenMice'),foundMice=document.getElementById('foundMice'),memoryBtn=document.getElementById('memoryBtn'),retryBtn=document.getElementById('retryBtn'),nextBtn=document.getElementById('nextBtn'),message=document.getElementById('message'),bubble=document.getElementById('bubble');let stageIndex=0,cells=[],targets=new Map(),phase='idle',timers=[],found=0,clicked=new Set();const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};function spiral(n){const a=[];let t=0,b=n-1,l=0,r=n-1;while(t<=b&&l<=r){for(let i=l;i<=r;i++)a.push(t*n+i);t++;for(let i=t;i<=b;i++)a.push(i*n+r);r--;if(t<=b){for(let i=r;i>=l;i--)a.push(b*n+i);b--}if(l<=r){for(let i=b;i>=t;i--)a.push(i*n+l);l++}}return a}function pick(total,count,used){const out=[];while(out.length<count){const n=Math.floor(Math.random()*total);if(used.has(n)||out.includes(n))continue;out.push(n)}return out}function makeTargets(st){targets=new Map();const used=new Set(),total=st.grid*st.grid;pick(total,st.mice,used).forEach(i=>{targets.set(i,'mouse');used.add(i)});pick(total,st.bombs,used).forEach(i=>{targets.set(i,'bomb');used.add(i)})}function build(st){board.innerHTML='';board.style.gridTemplateColumns=`repeat(${st.grid},1fr)`;cells=[];for(let i=0;i<st.grid*st.grid;i++){const c=document.createElement('button');c.type='button';c.className='cell';c.innerHTML=`<span class="inner"></span><span class="door">${i+1}</span>`;c.addEventListener('click',()=>guess(i));board.appendChild(c);cells.push(c)}}function resetVisual(){cells.forEach(c=>{c.className='cell';c.querySelector('.inner').textContent=''})}function update(){const st=STAGES[stageIndex];stageLabel.textContent=`STAGE ${stageIndex+1}`;hiddenMice.textContent=st.mice;foundMice.textContent=found}function setup(){clearTimers();phase='idle';found=0;clicked=new Set();const st=STAGES[stageIndex];build(st);makeTargets(st);resetVisual();update();memoryBtn.disabled=false;nextBtn.disabled=true;message.textContent='';message.className='message';bubble.textContent='이번 스테이지는 꽤 까다로울껄요?'}function symbol(type){return type==='mouse'?'🐭':'💣'}function open(i){cells[i].classList.add('open');if(targets.has(i))cells[i].querySelector('.inner').textContent=symbol(targets.get(i))}function close(i){cells[i].classList.remove('open');cells[i].querySelector('.inner').textContent=''}function reveal(){const st=STAGES[stageIndex];clearTimers();resetVisual();phase='show';memoryBtn.disabled=true;message.textContent='';let t=0;for(let loop=0;loop<st.loops;loop++){const seq=loop%2===0?spiral(st.grid):spiral(st.grid).reverse();seq.forEach(i=>{timers.push(setTimeout(()=>open(i),t));timers.push(setTimeout(()=>close(i),t+st.showMs));t+=st.openMs})}const fb=[...targets.keys()].sort(()=>Math.random()-.5).slice(0,Math.min(st.flashback,targets.size));fb.forEach(i=>{timers.push(setTimeout(()=>open(i),t));timers.push(setTimeout(()=>close(i),t+Math.max(170,st.showMs-80)));t+=Math.max(120,st.openMs-40)});timers.push(setTimeout(()=>{phase='guess';message.textContent='쥐를 모두 찾아보세요.'},t+220))}function showTargets(){cells.forEach((c,i)=>{if(targets.has(i)){c.classList.add('open');c.querySelector('.inner').textContent=symbol(targets.get(i))}})}function guess(i){if(phase!=='guess')return;const type=targets.get(i),c=cells[i];if(type==='mouse'){if(clicked.has(i))return;clicked.add(i);found++;c.classList.add('correct','open');c.querySelector('.inner').textContent='🐱🐭';update();if(found===STAGES[stageIndex].mice){phase='done';message.textContent='성공!';message.className='message ok';showTargets();nextBtn.disabled=stageIndex===STAGES.length-1}}else if(type==='bomb'){phase='done';c.classList.add('bomb','open');c.querySelector('.inner').textContent='💥';message.textContent='폭탄! 다시 도전하세요.';message.className='message bad';showTargets()}else{c.classList.add('wrong');c.querySelector('.inner').textContent='❌';message.textContent='아니에요.';message.className='message bad'}}memoryBtn.addEventListener('click',reveal);retryBtn.addEventListener('click',setup);nextBtn.addEventListener('click',()=>{if(stageIndex<STAGES.length-1){stageIndex++;setup()}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));setup()})();</script></body></html>
