<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>고양이퍼즐</title><meta name="theme-color" content="#ff970f"><link rel="manifest" href="manifest.webmanifest"><style>:root{--card:#fffdf9;--panel:#fff2df;--line:#f1d2b0;--text:#3a2a22;--muted:#7d6657;--accent:#ff960f;--accent2:#ffb347;--ok:#16a34a;--bad:#ef4444}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(180deg,#fffaf4,#ffe9d1 78%);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:12px}.app{width:min(100%,700px);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px 12px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:30px;letter-spacing:-1px}.stage{font-weight:900;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}.rule{margin-top:8px;font-size:17px;font-weight:900}.mini{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:stretch}.mini-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px;text-align:center}.mini-label{font-size:12px;color:var(--muted);font-weight:800}.mini-value{margin-top:3px;font-size:20px;font-weight:900}.memory-btn{border:0;border-radius:16px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-size:15px;font-weight:900;padding:0 12px;min-height:62px;cursor:pointer}.bubble{margin-top:12px;border:2px dashed #ffc46c;border-radius:18px;background:#fff;padding:13px 15px;font-size:17px;font-weight:900;text-align:center}.board-wrap{margin-top:14px;border:1px solid var(--line);border-radius:20px;background:#fff;padding:10px}.board{display:grid;gap:6px;max-width:560px;margin:0 auto}.cell{position:relative;aspect-ratio:1/1;border:2px solid var(--line);border-radius:12px;background:#fff7ee;overflow:hidden;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}.inner{position:relative;z-index:1;font-size:25px}.door{position:absolute;inset:0;background:linear-gradient(180deg,#ffe8c9,#ffd39a);display:flex;align-items:center;justify-content:center;font-weight:900;color:#8a5c24;font-size:12px;transform-origin:left center;transition:transform .2s ease,opacity .15s ease;border-radius:9px}.cell.open .door{transform:rotateY(88deg);opacity:.12}.cell.correct{border-color:#86d399;background:#effcf2}.cell.wrong{border-color:#f6a6a6;background:#fff1f1}.cell.bomb{border-color:#fb923c;background:#fff5eb}.message{margin-top:12px;min-height:44px;text-align:center;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center}.message.ok{color:var(--ok)}.message.bad{color:var(--bad)}.bottom{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom button{min-height:52px;border-radius:16px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:16px;cursor:pointer}.bottom button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:520px){h1{font-size:26px}.mini{grid-template-columns:1fr 1fr}.memory-btn{grid-column:1/-1}.board{gap:4px}.inner{font-size:21px}}</style></head><body><main class="app"><div class="top"><h1>고양이퍼즐</h1><div class="stage" id="stageLabel">STAGE 1</div></div><div class="rule" id="ruleText">쥐를 모두 찾아라. 폭탄은 안돼.</div><div class="mini"><div class="mini-card"><div class="mini-label">숨은 쥐</div><div class="mini-value" id="hiddenMice">3</div></div><div class="mini-card"><div class="mini-label">찾은 쥐</div><div class="mini-value" id="foundMice">0</div></div><div class="mini-card"><div class="mini-label">남은 시간</div><div class="mini-value" id="timerValue">12</div></div><button class="memory-btn" id="memoryBtn" type="button">기억 시작</button></div><div class="bubble" id="bubble">이번 스테이지는 꽤 까다로울껄요?</div><div class="board-wrap"><div class="board" id="board"></div></div><div class="message" id="message" aria-live="polite"></div><div class="bottom"><button id="retryBtn" type="button">다시하기</button><button id="nextBtn" type="button" disabled>다음 스테이지</button></div></main><script>(()=>{const STAGES=[{grid:5,mice:3,bombs:3,cheese:0,timeLimit:12},{grid:5,mice:4,bombs:4,cheese:0,timeLimit:12},{grid:5,mice:4,bombs:5,cheese:1,timeLimit:12},{grid:6,mice:4,bombs:5,cheese:1,timeLimit:12},{grid:6,mice:5,bombs:7,cheese:1,timeLimit:12},{grid:6,mice:5,bombs:9,cheese:2,timeLimit:12},{grid:7,mice:5,bombs:9,cheese:2,timeLimit:12},{grid:7,mice:6,bombs:12,cheese:2,timeLimit:12},{grid:7,mice:7,bombs:15,cheese:3,timeLimit:12},{grid:8,mice:6,bombs:14,cheese:2,timeLimit:12},{grid:8,mice:7,bombs:18,cheese:3,timeLimit:12},{grid:8,mice:8,bombs:22,cheese:4,timeLimit:12}],board=document.getElementById('board'),stageLabel=document.getElementById('stageLabel'),hiddenMice=document.getElementById('hiddenMice'),foundMice=document.getElementById('foundMice'),timerValue=document.getElementById('timerValue'),memoryBtn=document.getElementById('memoryBtn'),retryBtn=document.getElementById('retryBtn'),nextBtn=document.getElementById('nextBtn'),message=document.getElementById('message'),bubble=document.getElementById('bubble'),ruleText=document.getElementById('ruleText');let stageIndex=0,cells=[],targets=new Map(),phase='idle',timers=[],found=0,foundCheese=0,clicked=new Set(),countdown=null,audioCtx=null;function audio(){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function playTone(freq=440,dur=.08,type='sine',gain=.04,delay=0){try{const c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}function sfx(name){if(name==='shutter')playTone(240,.035,'square',.012);if(name==='mouse'){playTone(660,.07,'sine',.035);playTone(880,.08,'sine',.03,.05)}if(name==='cheese')playTone(1040,.09,'triangle',.035);if(name==='bomb'){playTone(120,.22,'sawtooth',.06);playTone(80,.25,'square',.04,.06)}if(name==='tick')playTone(520,.06,'square',.025);if(name==='clear'){playTone(660,.09,'sine',.04);playTone(880,.1,'sine',.04,.08);playTone(1100,.12,'sine',.04,.16)}if(name==='fail')playTone(170,.2,'sawtooth',.05)}const clearAll=()=>{timers.forEach(clearTimeout);timers=[];if(countdown){clearInterval(countdown);countdown=null}};function spiral(n){const a=[];let t=0,b=n-1,l=0,r=n-1;while(t<=b&&l<=r){for(let i=l;i<=r;i++)a.push(t*n+i);t++;for(let i=t;i<=b;i++)a.push(i*n+r);r--;if(t<=b){for(let i=r;i>=l;i--)a.push(b*n+i);b--}if(l<=r){for(let i=b;i>=t;i--)a.push(i*n+l);l++}}return a}function pick(total,count,used){const out=[];while(out.length<count){const n=Math.floor(Math.random()*total);if(used.has(n)||out.includes(n))continue;out.push(n)}return out}function makeTargets(st){targets=new Map();const used=new Set(),total=st.grid*st.grid;pick(total,st.mice,used).forEach(i=>{targets.set(i,'mouse');used.add(i)});pick(total,st.bombs,used).forEach(i=>{targets.set(i,'bomb');used.add(i)});pick(total,st.cheese,used).forEach(i=>{targets.set(i,'cheese');used.add(i)})}function build(st){board.innerHTML='';board.style.gridTemplateColumns=`repeat(${st.grid},1fr)`;cells=[];for(let i=0;i<st.grid*st.grid;i++){const c=document.createElement('button');c.type='button';c.className='cell';c.innerHTML=`<span class="inner"></span><span class="door">${i+1}</span>`;c.addEventListener('click',()=>guess(i));board.appendChild(c);cells.push(c)}}function resetVisual(){cells.forEach(c=>{c.className='cell';c.querySelector('.inner').textContent=''})}function update(){const st=STAGES[stageIndex];stageLabel.textContent=`STAGE ${stageIndex+1}`;hiddenMice.textContent=st.mice;foundMice.textContent=`${found}${st.cheese?` + 🧀${foundCheese}/${st.cheese}`:''}`;ruleText.textContent=st.cheese?'쥐와 치즈를 모두 찾아라. 폭탄은 안돼.':'쥐를 모두 찾아라. 폭탄은 안돼.'}function setup(){clearAll();phase='idle';found=0;foundCheese=0;clicked=new Set();const st=STAGES[stageIndex];build(st);makeTargets(st);resetVisual();timerValue.textContent=st.timeLimit;update();memoryBtn.disabled=false;nextBtn.disabled=true;message.textContent='';message.className='message';bubble.textContent='이번 스테이지는 꽤 까다로울껄요?'}function symbol(type){return type==='mouse'?'🐭':type==='cheese'?'🧀':'💣'}function open(i){cells[i].classList.add('open');if(targets.has(i))cells[i].querySelector('.inner').textContent=symbol(targets.get(i));sfx('shutter')}function close(i){cells[i].classList.remove('open');cells[i].querySelector('.inner').textContent=''}function startTimer(){const st=STAGES[stageIndex];let left=st.timeLimit;timerValue.textContent=left;countdown=setInterval(()=>{left--;timerValue.textContent=Math.max(0,left);if(left>0&&left<=3)sfx('tick');if(left<=0){clearInterval(countdown);countdown=null;fail('시간 초과! 다시 도전하세요.')}},1000)}function reveal(){const st=STAGES[stageIndex];clearAll();resetVisual();phase='show';memoryBtn.disabled=true;message.textContent='';const base=Math.max(115,260-(st.grid-5)*20),show=Math.max(210,360-(st.grid-5)*25),seq=spiral(st.grid);let t=0;seq.forEach(i=>{timers.push(setTimeout(()=>open(i),t));timers.push(setTimeout(()=>close(i),t+show));t+=base});const fb=[...targets.keys()].sort(()=>Math.random()-.5).slice(0,Math.min(2+Math.floor(stageIndex/3),targets.size));fb.forEach(i=>{timers.push(setTimeout(()=>open(i),t));timers.push(setTimeout(()=>close(i),t+220));t+=150});timers.push(setTimeout(()=>{phase='guess';message.textContent=st.cheese?'쥐와 치즈를 모두 찾으세요.':'쥐를 모두 찾아보세요.';startTimer()},t+180))}function showTargets(){cells.forEach((c,i)=>{if(targets.has(i)){c.classList.add('open');c.querySelector('.inner').textContent=symbol(targets.get(i))}})}function fail(text){if(phase==='done')return;phase='done';clearAll();message.textContent=text;message.className='message bad';sfx('fail');showTargets();memoryBtn.disabled=true;nextBtn.disabled=true}function clearStage(){phase='done';clearAll();message.textContent='성공!';message.className='message ok';sfx('clear');showTargets();nextBtn.disabled=stageIndex===STAGES.length-1}function guess(i){if(phase!=='guess'||clicked.has(i))return;const type=targets.get(i),c=cells[i],st=STAGES[stageIndex];clicked.add(i);if(type==='mouse'){found++;c.classList.add('correct','open');c.querySelector('.inner').textContent='🐱🐭';sfx('mouse')}else if(type==='cheese'){foundCheese++;c.classList.add('correct','open');c.querySelector('.inner').textContent='🐱🧀';sfx('cheese')}else if(type==='bomb'){c.classList.add('bomb','open');c.querySelector('.inner').textContent='💥';sfx('bomb');fail('폭탄! 다시 도전하세요.');return}else{c.classList.add('wrong');c.querySelector('.inner').textContent='❌';sfx('fail');fail('틀렸어요. 다시 도전하세요.');return}update();if(found===st.mice&&foundCheese===st.cheese)clearStage()}memoryBtn.addEventListener('click',()=>{audio();reveal()});retryBtn.addEventListener('click',setup);nextBtn.addEventListener('click',()=>{if(stageIndex<STAGES.length-1){stageIndex++;setup()}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));setup()})();</script></body></html>
