<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고양이퍼즐</title>
<meta name="theme-color" content="#ff970f">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--card:#fffdf9;--panel:#fff2df;--line:#f1d2b0;--text:#3a2a22;--muted:#7d6657;--accent:#ff960f;--accent2:#ffb347;--ok:#16a34a;--bad:#ef4444;--warn:#d97706}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(180deg,#fffaf4,#ffe9d1 78%);color:var(--text);height:100dvh;display:flex;justify-content:center;padding:0}
.app{width:min(100%,700px);height:100dvh;max-height:100dvh;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 10px 10px;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex:0 0 auto}.top h1{margin:0;font-size:26px;line-height:1.05}.stage-stack{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.stage,.round{font-weight:900;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;white-space:nowrap}.stage{background:var(--panel)}.round{background:#fff;color:#8a5c24}
.rule-line{margin-top:4px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}.rule{font-size:14px;font-weight:900}.mistake{font-size:11px;font-weight:900;border:1px solid #f2c087;background:#fff7ed;color:#9a5c10;border-radius:999px;padding:4px 8px;white-space:nowrap}.mini{margin-top:5px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:0 0 auto}.mini-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:5px 4px;text-align:center}.mini-label{font-size:10px;color:var(--muted);font-weight:800}.mini-value{margin-top:1px;font-size:16px;font-weight:900}.memory-btn{margin-top:5px;border:0;border-radius:13px;background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;font-size:15px;font-weight:900;min-height:40px;cursor:pointer;flex:0 0 auto}.memory-btn:disabled{opacity:.55}
.bubble{margin-top:5px;border:2px dashed #ffc46c;border-radius:13px;background:#fff;padding:6px 8px;font-size:13px;font-weight:900;text-align:center;flex:0 0 auto}.board-wrap{margin-top:5px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:5px;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.board{display:grid;gap:4px;width:min(100%,520px);max-height:100%;aspect-ratio:1/1}.cell{position:relative;aspect-ratio:1;border:1.5px solid var(--line);border-radius:9px;background:#fff7ee;overflow:hidden;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}.inner{position:relative;z-index:1;font-size:clamp(16px,4.8vw,25px)}.door{position:absolute;inset:0;background:linear-gradient(180deg,#ffe8c9,#ffd39a);display:flex;align-items:center;justify-content:center;font-weight:900;color:#8a5c24;font-size:10px;transform-origin:left center;transition:transform .2s ease,opacity .15s ease}.cell.open .door{transform:rotateY(88deg);opacity:.12}.cell.correct{border-color:#86d399;background:#effcf2}.cell.wrong{border-color:#f6a6a6;background:#fff1f1}.cell.bomb{border-color:#fb923c;background:#fff5eb}
.message{min-height:24px;margin-top:4px;text-align:center;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.message.ok{color:var(--ok)}.message.bad{color:var(--bad)}.message.warn{color:var(--warn)}.bottom{margin-top:4px;display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:0 0 auto}.bottom button{min-height:38px;border-radius:13px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:13px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(42,28,18,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.sheet{width:min(100%,520px);max-height:78vh;overflow:auto;background:#fffdf9;border-radius:22px;padding:16px;border:1px solid var(--line)}.sheet h2{margin:0 0 6px}.sheet-note{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:10px;line-height:1.45}.stage-row{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:13px;margin-bottom:7px;background:#fff}.stage-row.active{background:#fff1dc;border-color:#f2b35a}.stage-row strong{font-size:15px}.stage-row span{font-size:13px;color:var(--muted);font-weight:800}.close-btn{width:100%;margin-top:8px;min-height:42px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:900}
@media(max-width:520px){.app{border-radius:0}.top h1{font-size:23px}.mini{grid-template-columns:1fr 1fr}.stage,.round{font-size:10px;padding:4px 7px}.rule{font-size:12px}.mistake{font-size:10px}}
@media(max-height:760px){.app{padding-left:8px;padding-right:8px}.top h1{font-size:21px}.rule-line{margin-top:2px}.rule{font-size:11px}.mistake{padding:3px 7px}.mini{margin-top:3px;gap:4px}.mini-card{padding:3px}.mini-value{font-size:14px}.memory-btn{margin-top:3px;min-height:32px;font-size:13px}.bubble{margin-top:3px;padding:4px 6px;font-size:11px}.board-wrap{margin-top:3px;padding:3px}.message{min-height:20px;margin-top:2px;font-size:11px}.bottom{margin-top:2px}.bottom button{min-height:33px;font-size:12px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><h1>고양이퍼즐</h1><div class="stage-stack"><div class="stage" id="stageLabel">STAGE 1</div><div class="round" id="roundLabel">퍼즐맞추기 1 / 3</div></div></div>
  <div class="rule-line"><div class="rule" id="ruleText">쥐를 모두 찾아라. 폭탄은 안돼.</div><div class="mistake" id="mistakeLabel">실수 0 / 3</div></div>
  <div class="mini">
    <div class="mini-card"><div class="mini-label">퍼즐 단계</div><div class="mini-value" id="puzzleLevel">5×5</div></div>
    <div class="mini-card"><div class="mini-label">숨은 쥐</div><div class="mini-value" id="hiddenMice">3</div></div>
    <div class="mini-card"><div class="mini-label">찾은 쥐</div><div class="mini-value" id="foundMice">0</div></div>
    <div class="mini-card"><div class="mini-label">남은 시간</div><div class="mini-value" id="timerValue">12</div></div>
  </div>
  <button class="memory-btn" id="memoryBtn" type="button">기억 시작</button>
  <div class="bubble" id="bubble">퍼즐이 열릴 때 쥐와 폭탄의 위치를 기억하세요.</div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="message" id="message" aria-live="polite"></div>
  <div class="bottom"><button id="retryBtn" type="button">다시하기</button><button id="stageInfoBtn" type="button">게임 단계</button></div>
</main>
<div class="modal" id="stageModal"><div class="sheet"><h2>게임 단계</h2><div class="sheet-note">각 STAGE는 퍼즐맞추기 3회를 완료하면 다음 단계로 이동합니다.<br>폭탄은 즉시 실패, 빈칸은 3번 실수하면 해당 퍼즐맞추기가 끝납니다.</div><div id="stageList"></div><button class="close-btn" id="closeModal" type="button">닫기</button></div></div>
<script>
(()=>{
const MASTER_VOLUME=0.10,PUZZLES_PER_STAGE=3,MAX_MISTAKES=3;
const STAGES=[{grid:5,mice:3,bombs:3,cheese:0,timeLimit:12},{grid:5,mice:4,bombs:4,cheese:0,timeLimit:12},{grid:5,mice:4,bombs:5,cheese:1,timeLimit:12},{grid:6,mice:4,bombs:5,cheese:1,timeLimit:12},{grid:6,mice:5,bombs:7,cheese:1,timeLimit:12},{grid:6,mice:5,bombs:9,cheese:2,timeLimit:12},{grid:7,mice:5,bombs:9,cheese:2,timeLimit:12},{grid:7,mice:6,bombs:12,cheese:2,timeLimit:12},{grid:7,mice:7,bombs:15,cheese:3,timeLimit:12},{grid:8,mice:6,bombs:14,cheese:2,timeLimit:12},{grid:8,mice:7,bombs:18,cheese:3,timeLimit:12},{grid:8,mice:8,bombs:22,cheese:4,timeLimit:12}];
const board=document.getElementById('board'),stageLabel=document.getElementById('stageLabel'),roundLabel=document.getElementById('roundLabel'),puzzleLevel=document.getElementById('puzzleLevel'),hiddenMice=document.getElementById('hiddenMice'),foundMice=document.getElementById('foundMice'),timerValue=document.getElementById('timerValue'),memoryBtn=document.getElementById('memoryBtn'),retryBtn=document.getElementById('retryBtn'),message=document.getElementById('message'),bubble=document.getElementById('bubble'),ruleText=document.getElementById('ruleText'),mistakeLabel=document.getElementById('mistakeLabel'),stageInfoBtn=document.getElementById('stageInfoBtn'),stageModal=document.getElementById('stageModal'),stageList=document.getElementById('stageList'),closeModal=document.getElementById('closeModal');
let stageIndex=0,puzzleRound=1,cells=[],targets=new Map(),phase='idle',timers=[],found=0,foundCheese=0,mistakes=0,clicked=new Set(),countdown=null,audioCtx=null;
function audio(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function playTone(freq=440,dur=.08,type='sine',gain=MASTER_VOLUME,delay=0){try{const c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.min(.24,gain),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(name){if(name==='shutter')playTone(260,.028,'square',.055);if(name==='mouse'){playTone(680,.08,'sine',.14);playTone(900,.09,'sine',.12,.055)}if(name==='cheese'){playTone(1080,.09,'triangle',.14);playTone(1320,.08,'sine',.10,.07)}if(name==='bomb'){playTone(115,.24,'sawtooth',.22);playTone(76,.28,'square',.16,.05)}if(name==='tick')playTone(560,.065,'square',.11);if(name==='clear'){playTone(660,.1,'sine',.14);playTone(880,.11,'sine',.14,.08);playTone(1120,.14,'sine',.16,.17)}if(name==='fail'){playTone(180,.19,'sawtooth',.16);playTone(125,.22,'square',.11,.09)}}
const clearAll=()=>{timers.forEach(clearTimeout);timers=[];if(countdown){clearInterval(countdown);countdown=null}};
function spiral(n){const a=[];let t=0,b=n-1,l=0,r=n-1;while(t<=b&&l<=r){for(let i=l;i<=r;i++)a.push(t*n+i);t++;for(let i=t;i<=b;i++)a.push(i*n+r);r--;if(t<=b){for(let i=r;i>=l;i--)a.push(b*n+i);b--}if(l<=r){for(let i=b;i>=t;i--)a.push(i*n+l);l++}}return a}
function pick(total,count,used){const out=[];while(out.length<count){const n=Math.floor(Math.random()*total);if(used.has(n)||out.includes(n))continue;out.push(n)}return out}
function makeTargets(st){targets=new Map();const used=new Set(),total=st.grid*st.grid;pick(total,st.mice,used).forEach(i=>{targets.set(i,'mouse');used.add(i)});pick(total,st.bombs,used).forEach(i=>{targets.set(i,'bomb');used.add(i)});pick(total,st.cheese,used).forEach(i=>{targets.set(i,'cheese');used.add(i)})}
function build(st){board.innerHTML='';board.style.gridTemplateColumns=`repeat(${st.grid},1fr)`;board.style.gridTemplateRows=`repeat(${st.grid},1fr)`;cells=[];for(let i=0;i<st.grid*st.grid;i++){const c=document.createElement('button');c.type='button';c.className='cell';c.innerHTML=`<span class="inner"></span><span class="door">${i+1}</span>`;c.addEventListener('click',()=>guess(i));board.appendChild(c);cells.push(c)}}
function resetVisual(){cells.forEach(c=>{c.className='cell';c.querySelector('.inner').textContent=''})}
function renderStageList(){stageList.innerHTML=STAGES.map((st,i)=>`<div class="stage-row ${i===stageIndex?'active':''}"><strong>${i+1}단계</strong><span>퍼즐 ${st.grid}×${st.grid} · 쥐 ${st.mice} · 폭탄 ${st.bombs}${st.cheese?` · 치즈 ${st.cheese}`:''} · 퍼즐맞추기 3회</span></div>`).join('')}
function update(){const st=STAGES[stageIndex];stageLabel.textContent=`STAGE ${stageIndex+1}`;roundLabel.textContent=`퍼즐맞추기 ${puzzleRound} / ${PUZZLES_PER_STAGE}`;puzzleLevel.textContent=`${st.grid}×${st.grid}`;hiddenMice.textContent=st.mice;foundMice.textContent=`${found}${st.cheese?` + 🧀${foundCheese}/${st.cheese}`:''}`;mistakeLabel.textContent=`실수 ${mistakes} / ${MAX_MISTAKES}`;ruleText.textContent=st.cheese?'쥐와 치즈를 모두 찾아라. 폭탄은 안돼.':'쥐를 모두 찾아라. 폭탄은 안돼.';renderStageList()}
function setup(){clearAll();phase='idle';found=0;foundCheese=0;mistakes=0;clicked=new Set();const st=STAGES[stageIndex];build(st);makeTargets(st);resetVisual();timerValue.textContent=st.timeLimit;update();memoryBtn.disabled=false;message.textContent='';message.className='message';bubble.textContent='퍼즐이 열릴 때 쥐와 폭탄의 위치를 기억하세요.'}
function symbol(type){return type==='mouse'?'🐭':type==='cheese'?'🧀':'💣'}
function open(i){cells[i].classList.add('open');if(targets.has(i))cells[i].querySelector('.inner').textContent=symbol(targets.get(i));sfx('shutter')}
function close(i){cells[i].classList.remove('open');cells[i].querySelector('.inner').textContent=''}
function startTimer(){const st=STAGES[stageIndex];let left=st.timeLimit;timerValue.textContent=left;countdown=setInterval(()=>{left--;timerValue.textContent=Math.max(0,left);if(left>0&&left<=3)sfx('tick');if(left<=0){clearInterval(countdown);countdown=null;fail('시간 초과! 같은 퍼즐맞추기에 다시 도전하세요.')}},1000)}
function reveal(){const st=STAGES[stageIndex];clearAll();resetVisual();phase='show';memoryBtn.disabled=true;message.textContent='';bubble.textContent='퍼즐이 열릴 때 쥐와 폭탄의 위치를 기억하세요.';const base=Math.max(115,260-(st.grid-5)*20),show=Math.max(210,360-(st.grid-5)*25),seq=spiral(st.grid);let t=0;seq.forEach(i=>{timers.push(setTimeout(()=>open(i),t));timers.push(setTimeout(()=>close(i),t+show));t+=base});const fb=[...targets.keys()].sort(()=>Math.random()-.5).slice(0,Math.min(2+Math.floor(stageIndex/3),targets.size));fb.forEach(i=>{timers.push(setTimeout(()=>open(i),t));timers.push(setTimeout(()=>close(i),t+220));t+=150});timers.push(setTimeout(()=>{phase='guess';message.textContent=st.cheese?'쥐와 치즈를 모두 찾으세요. 빈칸은 3번까지 실수할 수 있어요.':'쥐를 모두 찾아보세요. 빈칸은 3번까지 실수할 수 있어요.';startTimer()},t+180))}
function showTargets(){cells.forEach((c,i)=>{if(targets.has(i)){c.classList.add('open');c.querySelector('.inner').textContent=symbol(targets.get(i))}})}
function fail(text){if(phase==='done')return;phase='done';clearAll();message.textContent=text;message.className='message bad';sfx('fail');showTargets();memoryBtn.disabled=true}
function clearPuzzle(){phase='done';clearAll();sfx('clear');showTargets();memoryBtn.disabled=true;if(puzzleRound<PUZZLES_PER_STAGE){message.textContent=`퍼즐맞추기 ${puzzleRound}/${PUZZLES_PER_STAGE} 완료! → ${puzzleRound+1}/${PUZZLES_PER_STAGE}`;message.className='message ok';bubble.textContent=`퍼즐맞추기 ${puzzleRound}/${PUZZLES_PER_STAGE} 성공! 다음 퍼즐맞추기로 이동합니다.`;timers.push(setTimeout(()=>{puzzleRound++;setup()},1050));return}if(stageIndex<STAGES.length-1){message.textContent=`퍼즐맞추기 3/3 완료! STAGE ${stageIndex+2}로 이동합니다.`;message.className='message ok';bubble.textContent=`STAGE ${stageIndex+1} 완료! → STAGE ${stageIndex+2}`;timers.push(setTimeout(()=>{stageIndex++;puzzleRound=1;setup()},1400));return}message.textContent='퍼즐맞추기 3/3 완료! 전체 단계 완성!';message.className='message ok';bubble.textContent='모든 STAGE를 완료했습니다!'}
function guess(i){if(phase!=='guess'||clicked.has(i))return;const type=targets.get(i),c=cells[i],st=STAGES[stageIndex];clicked.add(i);if(type==='mouse'){found++;c.classList.add('correct','open');c.querySelector('.inner').textContent='🐱🐭';sfx('mouse')}else if(type==='cheese'){foundCheese++;c.classList.add('correct','open');c.querySelector('.inner').textContent='🐱🧀';sfx('cheese')}else if(type==='bomb'){c.classList.add('bomb','open');c.querySelector('.inner').textContent='💥';sfx('bomb');fail('폭탄! 같은 퍼즐맞추기에 다시 도전하세요.');return}else{mistakes++;c.classList.add('wrong','open');c.querySelector('.inner').textContent='❌';sfx('fail');update();if(mistakes>=MAX_MISTAKES){fail('빈칸 실수 3회! 같은 퍼즐맞추기에 다시 도전하세요.');return}message.textContent=`빈칸입니다. 실수 ${mistakes} / ${MAX_MISTAKES} · 계속 찾아보세요.`;message.className='message warn';return}update();if(found===st.mice&&foundCheese===st.cheese)clearPuzzle()}
memoryBtn.addEventListener('click',()=>{audio();reveal()});retryBtn.addEventListener('click',setup);stageInfoBtn.addEventListener('click',()=>{renderStageList();stageModal.classList.add('show')});closeModal.addEventListener('click',()=>stageModal.classList.remove('show'));stageModal.addEventListener('click',e=>{if(e.target===stageModal)stageModal.classList.remove('show')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));setup();
})();
</script>
</body>
</html>
